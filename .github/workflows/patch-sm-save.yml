name: Patch SM save transport
on:
  push:
    paths:
      - '.github/workflows/patch-sm-save.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply production save patch
        run: python .github/scripts/patch_sm_save.py
      - name: Commit patched production files
        run: |
          git config user.name "Talk Today Save Fix"
          git config user.email "actions@users.noreply.github.com"
          git add Code.gs index.html
          git diff --check
          git diff --stat
          git commit -m "Fix SM saves with atomic CORS-safe submission and verification"
          git push
